[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
authors = [
    {name = "Northwestern University", email = "DL_FSM_GDS@e.northwestern.edu"}
]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "invenio-subjects-mesh-common>=0.4.0,<0.5.0",
]
description = "MeSH subject terms with qualifiers"
keywords = ["invenio", "inveniordm", "subjects", "MeSH"]
license = "MIT"
name = "invenio-subjects-mesh"
readme = "README.md"
requires-python = ">=3.11"
urls = {Repository = "https://github.com/galterlibrary/invenio-subjects-mesh"}
version = "2026.10.22.0"

[project.optional-dependencies]
dev = [
    "invenio-subjects-mesh-common[dev]>=0.4.0,<0.5.0",
    "invenio-search[opensearch2]>=3.1.0,<4.0.0",  # Needs to be specified separately as it's normally up to the instance
    "invoke>=3.0,<4.0",
    "pyyaml>=5.4.1",
    "pytest-invenio>=4.0.1,<5.0.0",
    # pytest-invenio includes pytest & co and docker-services-cli
    "ruff>=0.17.3,<2.0",
]

dev_pre = [
    "invenio-subjects-mesh-common[dev_pre]>=0.4.0,<0.5.0",
    "invenio-search[opensearch2]>=3.1.0,<4.0.0",
    "invoke>=3.0,<4.0",
    "pyyaml>=5.4.1",
    "pytest-invenio>=4.0.1,<5.0.0",
    "ruff>=0.17.3,<2.0",
]

[project.entry-points."invenio_rdm_records.fixtures"]
invenio_subjects_mesh = "invenio_subjects_mesh.vocabularies"

# Tools

[tool.hatch.build.targets.sdist]
include = [
  "invenio_subjects_mesh",
]

[tool.hatch.build.targets.wheel]
packages = [
  "invenio_subjects_mesh",
]

[tool.pytest.ini_options]
minversion = "6.0"
# ATTN: Remove the cov options when using breakpoint() since it interferes
addopts = '--cov=invenio_subjects_mesh --cov-report=term-missing'
testpaths = ["tests", "invenio_subjects_mesh"]

# Start Ruff tooling ---
[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
# D: pydocstyle rule
# E, W: all errors and warnings from pycodestyle
# I: isort rule
extend-select = ["D", "E", "I", "W"]
# RUF100: unused noqa -> bug with ruff's understanding of line length
# D401: imperative docstring -> too pedantic
# D403: first word capitalized -> doesn't work with first words that start with capital but have other capital letters in them
ignore = ["RUF100", "D401", "D403"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# D103: docstring required for public function -> ignore for test functions
"tests/**.py" = ["D103"]

# --- End Ruff tooling

[tool.uv]
# this is needed so that `uv run --extra dev_pre` doesn't
# raise an incompatibility error according to uv.
# See https://docs.astral.sh/uv/concepts/projects/config/#conflicting-dependencies
conflicts = [
    [
      { extra = "dev" },
      { extra = "dev_pre" },
    ],
]
